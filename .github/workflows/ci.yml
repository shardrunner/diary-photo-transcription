name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/scan-secrets.py
      - run: uv run --no-sync pytest -x
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyrefly check
      - run: uv run --no-sync python examples/demo/run.py
      - run: uv build --no-sources
      - run: uv run --isolated --no-project --with dist/diary_photo_transcription-0.1.0-py3-none-any.whl diary-photo-transcription --help
